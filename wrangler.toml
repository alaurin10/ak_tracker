name = "ak-tracker"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[vars]
# Calendar days roll over at midnight in this timezone.
TIMEZONE = "America/New_York"

[[kv_namespaces]]
binding = "AK_KV"
# Replace with the id printed by: npx wrangler kv namespace create AK_KV
id = "REPLACE_WITH_KV_NAMESPACE_ID"
